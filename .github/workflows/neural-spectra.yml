name: neural-spectra

on:
  push:
    paths:
      - "neural-spectra/**"
      - ".github/workflows/neural-spectra.yml"
  pull_request:
    paths:
      - "neural-spectra/**"
      - ".github/workflows/neural-spectra.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r neural-spectra/requirements.txt
      - name: Syntax check
        run: python -m py_compile neural-spectra/neural_spectra.py
      - name: Small experiment
        run: |
          python neural-spectra/neural_spectra.py experiment \
            --widths 16 --seeds 2 --epochs 1 \
            --out /tmp/neural-experiment.json
      - name: Small local controls
        run: |
          python neural-spectra/neural_spectra.py controls \
            --widths 16 --realizations 2 \
            --out /tmp/neural-controls.json
      - name: Formal analysis smoke test
        run: |
          python neural-spectra/neural_spectra.py formal \
            --experiment /tmp/neural-experiment.json \
            --out /tmp/neural-formal.json
