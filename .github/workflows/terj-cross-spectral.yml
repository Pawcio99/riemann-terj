name: terj-cross-spectral

on:
  push:
    paths:
      - "experiments/terj_cross_spectral/**"
      - ".github/workflows/terj-cross-spectral.yml"
  pull_request:
    paths:
      - "experiments/terj_cross_spectral/**"
      - ".github/workflows/terj-cross-spectral.yml"

jobs:
  stage-a-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Syntax check
        run: python -m py_compile experiments/terj_cross_spectral/cross_spectral.py
      - name: Run synthetic Stage A example
        run: |
          python experiments/terj_cross_spectral/cross_spectral.py \
            --input experiments/terj_cross_spectral/example_input.json \
            --out /tmp/terj-cross-result.json \
            --mc-reps 5000
      - name: Validate JSON
        run: python -m json.tool /tmp/terj-cross-result.json > /dev/null
